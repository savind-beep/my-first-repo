<html>
  <head>
    <title>Variable Declaration</title>
  </head>
  <body>
    <script>
      // Variable Declaration
      var name = "John Doe";
      let age = 30;
      const country = "USA";

      // Displaying the values
      document.write("Name: " + name + "<br>");
      document.write("Age: " + age + "<br>");
      document.write("Country: " + country + "<br>");
    </script>
  </body>
</html>
