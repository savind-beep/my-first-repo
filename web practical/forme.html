<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
    <link rel="stylesheet" href="activity3.CSS" />
  </head>
  <body>
    <center>
      <h1>Registration form</h1>
      <div class="page-shell">
        <div class="top-bar">
          <span>28 / 11</span>
          <span>125%</span>
          <span>◔</span>
          <span>🪟</span>
          <span>🔊</span>
        </div>

        <main class="form-wrapper">
          <h1>Registration form</h1>

          <form class="form-box">
            <label class="section-title">User personal information</label>

            <input
              type="text"
              placeholder="Enter your full name"
              aria-label="Full name"
            />
            <input
              type="email"
              placeholder="Enter your email"
              aria-label="Email"
            />
            <input
              type="password"
              placeholder="Enter your password"
              aria-label="Password"
            />
            <input
              type="password"
              placeholder="confirm your password"
              aria-label="Confirm password"
            />

            <div class="gender-block">
              <label class="gender-title">Enter your gender</label>
              <label class="radio-option">
                <input type="radio" name="gender" />
                <span>Male</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="gender" />
                <span>Female</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="gender" />
                <span>others</span>
              </label>
            </div>

            <label class="address-label">Enter your Address:</label>
            <textarea aria-label="Address"></textarea>

            <button type="submit">sign-up</button>
          </form>
        </main>
      </div>
    </center>
  </body>
</html>
